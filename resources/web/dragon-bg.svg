             C 780 560, 700 560, 660 510
             C 610 445, 650 400, 700 420
             C 745 438, 730 480, 690 470
             C 655 462, 650 425, 600 415
             C 520 398, 470 470, 400 470
             C 320 470, 300 400, 340 350
             C 375 305, 430 320, 425 365
             C 421 402, 375 400, 370 365
             C 366 335, 300 320, 240 260
