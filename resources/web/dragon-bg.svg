    <path d="M 400 405 C 400 385, 415 372, 435 372" />
    <path d="M 470 435 C 472 415, 490 404, 510 408" />
    <path d="M 560 405 C 566 386, 586 378, 604 386" />
    <path d="M 690 405 C 700 388, 722 384, 738 394" />
    <path d="M 760 490 C 772 476, 794 474, 808 486" />

    <!-- simple whisker-like cloud swirl near the tail -->
    <path d="M 800 555 C 815 545, 815 525, 800 518" />
    <path d="M 780 580 C 800 578, 812 562, 806 545" />
